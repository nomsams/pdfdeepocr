<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DeepSeek OCR Multi-Proxy (v4)</title>
  <style>
    :root{
      --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#c9d1d9; 
      --accent:#58a6ff; --ok:#238636; --err:#da3633; --warn:#d29922;
      --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    }
    body{background:var(--bg); color:var(--text); font-family:var(--font); margin:0; padding:20px; height:100vh; box-sizing:border-box; display:flex; flex-direction:column;}
    .container{max-width:1000px; margin:0 auto; width:100%; display:grid; gap:20px; height:100%; grid-template-rows: auto auto 1fr;}
    
    /* Cards */
    .card{background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:16px;}
    .header{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:10px;}
    h2{margin:0; font-size:16px; color:var(--accent);}
    
    /* Inputs */
    .input-group{margin-bottom:10px;}
    label{display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:#8b949e;}
    input[type="text"], input[type="url"]{
      width:100%; background:#0d1117; border:1px solid var(--border); color:var(--text); 
      padding:8px; border-radius:6px; box-sizing:border-box; font-family:monospace;
    }
    input:focus{border-color:var(--accent); outline:none;}

    /* Drop Zone */
    .drop-zone{
      border:2px dashed var(--border); border-radius:6px; padding:30px; text-align:center; 
      cursor:pointer; transition:0.2s; background:#0d1117;
    }
    .drop-zone:hover, .drop-zone.dragover{border-color:var(--accent); background:#1c2128;}
    
    /* Buttons */
    .btn-row{display:flex; gap:10px; margin-top:10px;}
    button{
      background:var(--panel); border:1px solid var(--border); color:var(--text); 
      padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:600; font-size:13px;
    }
    button.primary{background:var(--ok); color:white; border-color:rgba(255,255,255,0.1);}
    button:disabled{opacity:0.5; cursor:not-allowed;}
    button:hover:not(:disabled){filter:brightness(1.1);}

    /* Logs & Output */
    .split-view{display:grid; grid-template-columns:1fr 1fr; gap:20px; height:100%; min-height:0;}
    textarea, .log-box{
      width:100%; height:100%; background:#0d1117; border:1px solid var(--border); 
      color:var(--text); padding:10px; border-radius:6px; box-sizing:border-box; 
      font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace;
      resize:none; font-size:12px;
    }
    .log-box{overflow-y:auto; white-space:pre-wrap;}
    .log-entry{margin-bottom:4px; border-bottom:1px solid #21262d; padding-bottom:2px;}
    .log-time{color:#8b949e; margin-right:8px;}
    .l-info{color:var(--accent);}
    .l-err{color:var(--err);}
    .l-success{color:var(--ok);}
    .l-warn{color:var(--warn);}

    /* Progress */
    .progress-container{height:4px; background:var(--border); margin-top:10px; border-radius:2px; overflow:hidden;}
    .progress-bar{height:100%; width:0%; background:var(--accent); transition:width 0.2s;}
    
    @media(max-width:700px){ .split-view{grid-template-columns:1fr; grid-template-rows:1fr 1fr;} }
  </style>
</head>
<body>

<div class="container">
  <!-- Config Section -->
  <div class="card">
    <div class="header">
      <h2>Configuration</h2>
      <div style="font-size:12px">Status: <span id="statusBadge" style="color:var(--text)">Idle</span></div>
    </div>
    <div class="input-group">
      <label>Target API Endpoint</label>
      <input type="url" id="apiUrl" value="https://api.alphaxiv.org/models/v1/deepseek/deepseek-ocr/inference">
    </div>
    <div class="input-group">
      <label>Custom Proxy (Optional - Overrides List)</label>
      <input type="url" id="customProxy" placeholder="https://your-worker.workers.dev/?url=">
    </div>
  </div>

  <!-- Upload Section -->
  <div class="card">
    <div class="drop-zone" id="dropZone">
      <div id="dropText">
        <strong style="font-size:1.2em; color:var(--text)">Drag & Drop PDF Here</strong><br>
        <span style="color:#8b949e">or click to browse</span>
      </div>
      <input type="file" id="fileInput" accept="application/pdf" style="display:none">
    </div>
    
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="btn-row">
      <button id="startBtn" class="primary" disabled>Start OCR</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="clearBtn">Clear Logs</button>
      <div style="flex:1"></div>
      <button id="downloadBtn" disabled>Download Markdown</button>
    </div>
  </div>

  <!-- Output Section -->
  <div class="split-view">
    <div style="display:flex; flex-direction:column; height:100%">
      <label>Live Logs (Proxy Waterfall)</label>
      <div class="log-box" id="logBox"></div>
    </div>
    <div style="display:flex; flex-direction:column; height:100%">
      <label>Markdown Result</label>
      <textarea id="outputBox" placeholder="Result will appear here..." readonly></textarea>
    </div>
  </div>
</div>

<script>
/**
 * PROXY LIST (Best to Worst for File Uploads)
 * Note: Many proxies block POST requests or strip headers. These are selected for compatibility.
 */
const PROXY_LIST = [
  // 1. CorsProxy.io - Usually the fastest, but has strict size limits (approx 1MB)
  { name: "CorsProxy.io", url: "https://corsproxy.io/?", limit: "1MB" },
  
  // 2. Corsfix - Newer, reliable, similar limits
  { name: "Corsfix", url: "https://proxy.corsfix.com/?", limit: "1MB" },
  
  // 3. AllOrigins - "Raw" mode sometimes handles POST better than others
  { name: "AllOrigins", url: "https://api.allorigins.win/raw?url=", limit: "Unknown" },
  
  // 4. CORS Anywhere (Heroku) - The "Nuclear Option". 
  // REQUIRES USER INTERACTION. We will detect this and ask user to click the button.
  { name: "CORS Anywhere (Demo)", url: "https://cors-anywhere.herokuapp.com/", limit: "Soft Limit", requiresAuth: true },
  
  // 5. ThingProxy - Very strict limits, likely to fail for PDFs, but worth a shot
  { name: "ThingProxy", url: "https://thingproxy.freeboard.io/fetch/", limit: "100KB" }
];

// --- Application State ---
let state = {
  file: null,
  isProcessing: false,
  xhr: null
};

// --- DOM Elements ---
const UI = {
  drop: document.getElementById('dropZone'),
  input: document.getElementById('fileInput'),
  text: document.getElementById('dropText'),
  start: document.getElementById('startBtn'),
  stop: document.getElementById('stopBtn'),
  dl: document.getElementById('downloadBtn'),
  logs: document.getElementById('logBox'),
  out: document.getElementById('outputBox'),
  bar: document.getElementById('progressBar'),
  status: document.getElementById('statusBadge'),
  api: document.getElementById('apiUrl'),
  custom: document.getElementById('customProxy')
};

// --- Logger ---
function log(msg, type = 'info') {
  const div = document.createElement('div');
  div.className = `log-entry l-${type}`;
  const time = new Date().toLocaleTimeString();
  div.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
  UI.logs.appendChild(div);
  UI.logs.scrollTop = UI.logs.scrollHeight;
}

// --- File Handling ---
UI.drop.addEventListener('click', () => UI.input.click());
UI.input.addEventListener('change', e => setFile(e.target.files[0]));
UI.drop.addEventListener('dragover', e => { e.preventDefault(); UI.drop.classList.add('dragover'); });
UI.drop.addEventListener('dragleave', () => UI.drop.classList.remove('dragover'));
UI.drop.addEventListener('drop', e => {
  e.preventDefault(); 
  UI.drop.classList.remove('dragover');
  setFile(e.dataTransfer.files[0]);
});

function setFile(f) {
  if (!f) return;
  if (f.type !== 'application/pdf') {
    log("Error: Only PDF files are supported.", "err");
    return;
  }
  state.file = f;
  UI.text.innerHTML = `<strong>${f.name}</strong><br><span style="color:var(--accent)">${(f.size/1024/1024).toFixed(2)} MB</span>`;
  UI.start.disabled = false;
  log(`File selected: ${f.name} (${(f.size/1024).toFixed(1)} KB)`);
  
  // Warn about size
  if(f.size > 1024 * 1024) {
    log("⚠️ Warning: File is > 1MB. Free proxies may reject this.", "warn");
  }
}

// --- Main Logic ---
UI.start.addEventListener('click', async () => {
  if (!state.file) return;
  
  resetUI();
  state.isProcessing = true;
  UI.start.disabled = true;
  UI.stop.disabled = false;
  UI.status.textContent = "Running...";
  UI.status.style.color = "var(--warn)";

  const targetApi = UI.api.value;
  const customProxy = UI.custom.value;
  
  // Build the list of proxies to try
  let attemptList = [];
  if (customProxy) {
    attemptList.push({ name: "Custom Proxy", url: customProxy });
  }
  attemptList = [...attemptList, ...PROXY_LIST];

  // Waterfall Loop
  for (const proxy of attemptList) {
    if (!state.isProcessing) break; // User stopped

    log(`Attempting via: <strong>${proxy.name}</strong>...`, "info");
    
    try {
      // Construct URL
      // Most proxies work as ProxyURL + TargetURL
      // Some need encoding, but most modern ones handle raw strings better for redirects
      const fullUrl = proxy.url + targetApi;
      
      const result = await uploadFile(fullUrl, state.file, proxy);
      
      // If we get here, we succeeded
      handleSuccess(result, proxy.name);
      return; 

    } catch (error) {
      log(`❌ ${proxy.name} Failed: ${error.message}`, "err");
      
      // Special handling for CORS Anywhere
      if (proxy.requiresAuth && error.status === 403) {
        log(`💡 <strong>Action Required:</strong> <a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank" style="color:white;text-decoration:underline">Click here to unlock CORS Anywhere</a>, then try again.`, "warn");
      }
    }
    
    UI.bar.style.width = '0%'; // Reset bar for next attempt
  }

  if (state.isProcessing) {
    log("💀 All proxies failed. Try a smaller file or a custom proxy.", "err");
    finish(false);
  }
});

UI.stop.addEventListener('click', () => {
  if (state.xhr) state.xhr.abort();
  log("🛑 Stopped by user.", "warn");
  finish(false);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  UI.logs.innerHTML = '';
  UI.out.value = '';
});

// --- The Upload Function (XHR for Progress) ---
function uploadFile(url, file, proxyConfig) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    state.xhr = xhr;

    xhr.open('POST', url, true);
    
    // CRITICAL: Do NOT set Content-Type header. 
    // The browser automatically sets it to multipart/form-data; boundary=...
    // If you set it manually, the server won't be able to parse the file.
    
    // Optional: Add headers if specific proxies need them
    xhr.setRequestHeader('Accept', 'application/json');
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest'); // Helps some proxies

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = (e.loaded / e.total) * 100;
        UI.bar.style.width = percent + '%';
      }
    };

    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(xhr.responseText);
      } else {
        reject({ message: `HTTP ${xhr.status} ${xhr.statusText}`, status: xhr.status });
      }
    };

    xhr.onerror = () => reject({ message: "Network Error (CORS or Blocked)", status: 0 });
    xhr.ontimeout = () => reject({ message: "Timeout", status: 408 });

    const formData = new FormData();
    formData.append('file', file);
    
    // DeepSeek API specific params (if needed, usually just 'file' is enough)
    // formData.append('model', 'deepseek-ocr'); 

    xhr.send(formData);
  });
}

// --- Response Parser ---
function handleSuccess(rawText, proxyName) {
  log(`✅ Success via ${proxyName}! Parsing response...`, "success");
  
  let markdown = "";
  
  try {
    // The proxy might wrap the response in its own JSON, or return the API's JSON
    // We need to find the actual content.
    const json = JSON.parse(rawText);
    
    // Recursive search for the longest string in the JSON object
    // (DeepSeek usually returns { "content": "..." } or similar)
    markdown = findLongestString(json);
    
    if (!markdown || markdown.length < 50) {
      // Fallback: maybe the raw text was the markdown?
      markdown = JSON.stringify(json, null, 2);
    }
  } catch (e) {
    // Not JSON, assume raw text
    markdown = rawText;
  }

  UI.out.value = markdown;
  finish(true);
}

function findLongestString(obj) {
  if (typeof obj === 'string') return obj;
  if (typeof obj !== 'object' || obj === null) return '';
  
  let maxStr = '';
  Object.values(obj).forEach(val => {
    const s = findLongestString(val);
    if (s.length > maxStr.length) maxStr = s;
  });
  return maxStr;
}

function finish(success) {
  state.isProcessing = false;
  state.xhr = null;
  UI.start.disabled = false;
  UI.stop.disabled = true;
  UI.dl.disabled = !success;
  UI.status.textContent = success ? "Completed" : "Failed";
  UI.status.style.color = success ? "var(--ok)" : "var(--err)";
}

function resetUI() {
  UI.out.value = '';
  UI.bar.style.width = '0%';
  UI.logs.innerHTML = '';
}

// Download Handler
UI.dl.addEventListener('click', () => {
  const blob = new Blob([UI.out.value], {type: 'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.file ? state.file.name.replace('.pdf', '') : 'ocr') + '.md';
  a.click();
});

</script>
</body>
</html>

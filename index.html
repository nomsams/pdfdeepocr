<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DeepSeek OCR → Markdown (v3 Reliability)</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#151923; --muted:#232836; --text:#e6e6e6; --accent:#62d0ff; --ok:#30d158; --warn:#ffcc00; --err:#ff453a;
      --shadow:0 8px 30px rgba(0,0,0,.35);
    }
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Helvetica Neue,Arial}
    .wrap{max-width:1100px; margin:24px auto; padding:0 16px;}
    .grid{display:grid; gap:12px}
    .card{background:var(--panel); border:1px solid var(--muted); border-radius:14px; padding:16px; box-shadow:var(--shadow);}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .grow{flex:1}
    label{display:block; font-weight:600; margin-bottom:6px; color:#aab2c0;}
    input[type="text"],input[type="url"],input[type="number"]{
      width:100%; background:#0d1017; border:1px solid var(--muted); color:var(--text); padding:10px 12px; border-radius:10px; outline:none; font-family:inherit;
    }
    input:focus{border-color:var(--accent)}
    .drop{border:2px dashed var(--muted); border-radius:14px; padding:24px; text-align:center; transition:.2s; cursor:pointer;}
    .drop:hover,.drop.dragover{border-color:var(--accent); background:#1a202e}
    .btn{background:var(--accent); color:#00121a; border:0; border-radius:8px; padding:10px 16px; font-weight:700; cursor:pointer; min-width:100px;}
    .btn:disabled{opacity:0.5; cursor:not-allowed; filter:grayscale(1);}
    .btn.secondary{background:#2c3547; color:var(--text)}
    .btn.ok{background:var(--ok); color:#001a08}
    .bar-bg{height:8px; background:#0c1018; border-radius:99px; overflow:hidden; position:relative;}
    .bar-fg{height:100%; width:0%; background:var(--accent); transition:width 0.3s;}
    .pulse{animation:pulse 2s infinite;}
    @keyframes pulse{0%{opacity:1} 50%{opacity:0.6} 100%{opacity:1}}
    
    textarea,pre{width:100%; background:#0b0f15; color:#eaeffb; border:1px solid var(--muted); border-radius:10px; padding:12px; font-family:ui-monospace,monospace;}
    textarea{min-height:300px; resize:vertical; line-height:1.6;}
    pre{max-height:400px; overflow:auto; white-space:pre-wrap; font-size:12px;}
    
    .status-row{display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:13px;}
    .timer{font-variant-numeric:tabular-nums; color:var(--accent);}
    .cols{display:grid; grid-template-columns:1fr; gap:12px}
    @media(min-width:980px){ .cols{grid-template-columns:1fr 1fr} }
    
    .badge{display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:bold; text-transform:uppercase;}
    .b-warn{background:rgba(255, 204, 0, 0.15); color:var(--warn); border:1px solid rgba(255,204,0,0.3);}
    .b-ok{background:rgba(48, 209, 88, 0.15); color:var(--ok); border:1px solid rgba(48,209,88,0.3);}
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h1 style="margin:0">DeepSeek OCR → Markdown <span style="font-size:0.6em; opacity:0.6; font-weight:400;">v3 Reliability</span></h1>
    </div>

    <div class="grid">
      <!-- Settings -->
      <div class="card">
        <div class="row">
          <div class="grow">
            <label>API Endpoint</label>
            <input id="endpoint" type="url" value="https://api.alphaxiv.org/models/v1/deepseek/deepseek-ocr/inference"/>
          </div>
          <div class="grow">
            <label>Output Filename</label>
            <input id="filename" type="text" value="ocr-result.md"/>
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="grow">
            <label>CorsProxy.io URL (Recommended)</label>
            <input id="proxyUrl" type="text" value="https://corsproxy.io/?" readonly style="opacity:0.7; cursor:not-allowed"/>
          </div>
          <div class="grow">
            <label>Custom Proxy (Optional)</label>
            <input id="customProxy" type="url" placeholder="https://your-proxy.com/..."/>
          </div>
        </div>
      </div>

      <!-- Upload & Controls -->
      <div class="card">
        <div id="drop" class="drop">
          <div style="pointer-events:none">
            <strong style="font-size:16px">Click to Select PDF</strong> or Drag & Drop<br/>
            <span class="muted" style="font-size:12px">Note: Processing usually takes 2-4 minutes per file.</span>
          </div>
          <input id="file" type="file" accept="application/pdf" style="display:none"/>
        </div>
        
        <div id="fileInfo" class="row" style="margin-top:10px; display:none">
          <span class="badge b-ok">PDF Selected</span>
          <span id="fileName" class="muted"></span>
        </div>

        <div class="row" style="margin-top:16px">
          <button id="start" class="btn">Start OCR</button>
          <button id="cancel" class="btn secondary" disabled>Cancel</button>
          <button id="downloadLog" class="btn secondary">Save Logs</button>
        </div>

        <!-- Progress -->
        <div style="margin-top:16px">
          <div class="status-row">
            <strong id="statusText" class="pulse">Ready.</strong>
            <span id="timer" class="timer">00:00</span>
          </div>
          <div class="bar-bg" style="margin-top:6px"><div id="prog" class="bar-fg"></div></div>
        </div>
      </div>

      <!-- Output -->
      <div class="card cols">
        <div>
          <label>Markdown Output</label>
          <textarea id="output" placeholder="Results will appear here..." readonly></textarea>
          <div class="row" style="margin-top:10px">
            <button id="dlBtn" class="btn ok" disabled>Download .md</button>
            <button id="copyBtn" class="btn secondary" disabled>Copy Text</button>
          </div>
        </div>
        <div>
          <label>Live Logs</label>
          <pre id="log">Waiting for input...</pre>
          <div style="margin-top:8px; font-size:12px; color:#888;">
            <strong>Strategy:</strong> Parallel Race (Priority: corsproxy.io) → Deep Search → 5 Retries.
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden form for fallbacks -->
  <iframe name="sink" id="sink" style="display:none"></iframe>
  <form id="hiddenForm" target="sink" method="POST" enctype="multipart/form-data" style="display:none">
    <input type="file" name="file" id="hiddenInput"/>
  </form>

  <script>
    // --- Configuration ---
    const CONFIG = {
      maxAttempts: 5,        // Aggressive retries
      backoffBase: 5000,     // 5s wait between tries (prevents spamming)
      xhrTimeout: 600000,    // 10 Minutes (crucial for slow deepseek)
      formTimeout: 300000,   // 5 Minutes (crucial for fallbacks)
      parallelDelay: 2000    // Stagger starts
    };

    // --- DOM ---
    const qs = s => document.querySelector(s);
    const UI = {
      drop: qs('#drop'), file: qs('#file'), info: qs('#fileInfo'), name: qs('#fileName'),
      start: qs('#start'), cancel: qs('#cancel'), logBtn: qs('#downloadLog'),
      status: qs('#statusText'), timer: qs('#timer'), prog: qs('#prog'),
      out: qs('#output'), log: qs('#log'),
      dl: qs('#dlBtn'), copy: qs('#copyBtn'),
      endpoint: qs('#endpoint'), custom: qs('#customProxy')
    };

    // --- State ---
    let state = {
      file: null,
      running: false,
      logs: [],
      xhrs: [],
      startTime: 0,
      timerId: null
    };

    // --- Logger ---
    const log = (msg, level='INFO') => {
      const ts = new Date().toLocaleTimeString('en-GB');
      const line = `[${ts}] [${level}] ${msg}`;
      state.logs.push(line);
      UI.log.textContent = state.logs.join('\n');
      UI.log.scrollTop = UI.log.scrollHeight;
    };

    // --- File Handling ---
    UI.drop.addEventListener('click', () => UI.file.click());
    UI.drop.addEventListener('dragover', e => { e.preventDefault(); UI.drop.classList.add('dragover'); });
    UI.drop.addEventListener('dragleave', () => UI.drop.classList.remove('dragover'));
    UI.drop.addEventListener('drop', e => {
      e.preventDefault(); UI.drop.classList.remove('dragover');
      handleFile(e.dataTransfer.files[0]);
    });
    UI.file.addEventListener('change', e => handleFile(e.target.files[0]));

    function handleFile(f) {
      if(!f || f.type !== 'application/pdf') return alert('Please select a PDF file.');
      state.file = f;
      UI.info.style.display = 'flex';
      UI.name.textContent = `${f.name} (${(f.size/1024/1024).toFixed(2)} MB)`;
      UI.start.disabled = false;
      log(`Selected file: ${f.name}`);
    }

    // --- Timer ---
    function startTimer() {
      state.startTime = Date.now();
      UI.timer.textContent = "00:00";
      state.timerId = setInterval(() => {
        const diff = Math.floor((Date.now() - state.startTime) / 1000);
        const m = Math.floor(diff / 60).toString().padStart(2,'0');
        const s = (diff % 60).toString().padStart(2,'0');
        UI.timer.textContent = `${m}:${s}`;
        
        // UX: Let user know we are still alive if it's taking long
        if(diff === 60) log("1 minute elapsed. Still processing (normal)...", "WAIT");
        if(diff === 180) log("3 minutes elapsed. Large file/slow proxy (hang in there)...", "WAIT");
      }, 1000);
    }
    function stopTimer() { clearInterval(state.timerId); }

    // --- Main Logic ---
    UI.start.addEventListener('click', async () => {
      if(!state.file) return;
      reset();
      state.running = true;
      UI.start.disabled = true;
      UI.cancel.disabled = false;
      UI.status.textContent = "Negotiating Proxies...";
      startTimer();

      const candidates = getCandidates();
      
      // We run them as a "Race", but staggered to avoid network congestion
      const promises = candidates.map((c, i) => runCandidate(c, i * CONFIG.parallelDelay));

      const winner = await Promise.any(promises.map(p => p.catch(e => {
        // We catch here so Promise.any waits for the first *success*, not failure
        return new Promise(() => {}); 
      })));

      // If we get here via await, we likely have a result, but check state
      if(!state.running && !UI.out.value) {
        setStatus("Cancelled or Failed", "err");
      }
      
      // Watchdog: If all failed
      setTimeout(() => {
        if(state.running && !UI.out.value) {
          log("All proxies exhausted. Try a smaller file or checking internet.", "FATAL");
          finish(false);
        }
      }, 5000);
    });

    UI.cancel.addEventListener('click', () => {
      log("Cancelled by user.", "WARN");
      finish(false);
    });

    function reset() {
      state.running = false;
      state.xhrs.forEach(x => x.abort());
      state.xhrs = [];
      state.logs = [];
      UI.out.value = '';
      UI.prog.style.width = '0%';
      UI.dl.disabled = true;
      UI.copy.disabled = true;
      stopTimer();
    }

    function finish(success) {
      state.running = false;
      stopTimer();
      UI.start.disabled = false;
      UI.cancel.disabled = true;
      UI.status.classList.remove('pulse');
      if(success) UI.status.textContent = "Completed Successfully";
      else UI.status.textContent = "Failed / Stopped";
    }

    // --- Candidate Runner ---
    function getCandidates() {
      const endpoint = qs('#endpoint').value.trim();
      const custom = qs('#customProxy').value.trim();
      
      // PRIORITY ORDER based on logs
      const list = [
        { name: 'CorsProxy.io', url: `https://corsproxy.io/?${encodeURIComponent(endpoint)}`, type: 'xhr' },
        { name: 'Proxy.Cors.sh', url: `https://proxy.cors.sh/${endpoint}`, type: 'xhr' },
        { name: 'Direct', url: endpoint, type: 'xhr' },
        { name: 'CorsProxy.io (Fallback)', url: `https://corsproxy.io/?${encodeURIComponent(endpoint)}`, type: 'form' }, // Form fallback
      ];
      
      if(custom) list.unshift({ name: 'Custom Proxy', url: custom, type: 'xhr' });
      return list;
    }

    async function runCandidate(c, delay) {
      await new Promise(r => setTimeout(r, delay));
      if(!state.running) return Promise.reject();

      for(let attempt = 1; attempt <= CONFIG.maxAttempts; attempt++) {
        if(!state.running) return Promise.reject();
        
        const label = `${c.name} [${c.type.toUpperCase()} ${attempt}/${CONFIG.maxAttempts}]`;
        log(`${label} Starting...`);

        try {
          const result = c.type === 'xhr' 
            ? await tryXHR(c.url, label) 
            : await tryForm(c.url, label);

          if(result) {
            handleSuccess(result, label);
            return result;
          }
        } catch(e) {
          // Failure logged in sub-function
        }

        // Backoff
        if(attempt < CONFIG.maxAttempts) {
          const wait = CONFIG.backoffBase + (attempt * 1000);
          log(`${label} Failed. Waiting ${wait/1000}s...`, "WARN");
          await new Promise(r => setTimeout(r, wait));
        }
      }
      return Promise.reject();
    }

    // --- XHR Logic ---
    function tryXHR(url, label) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        state.xhrs.push(xhr);
        
        xhr.open('POST', url, true);
        xhr.timeout = CONFIG.xhrTimeout;
        
        // CRITICAL: Prevent credentials to avoid strict CORS preflight issues
        xhr.withCredentials = false; 
        xhr.setRequestHeader('Accept', 'application/json, text/plain, */*');

        const fd = new FormData();
        fd.append('file', state.file);

        xhr.upload.onprogress = e => {
          if(e.lengthComputable && state.running) {
            const pct = (e.loaded / e.total) * 100;
            if(pct % 10 === 0) UI.prog.style.width = pct + '%'; // Don't repaint too often
          }
        };

        xhr.onload = () => {
          if(xhr.status >= 200 && xhr.status < 300) {
            const txt = processResponse(xhr.responseText);
            if(txt) resolve(txt);
            else {
              log(`${label} Valid HTTP but empty/bad JSON`, "ERR");
              reject();
            }
          } else {
            log(`${label} HTTP ${xhr.status}`, "ERR");
            reject();
          }
        };

        xhr.onerror = () => { log(`${label} Network/CORS Error`, "ERR"); reject(); };
        xhr.ontimeout = () => { log(`${label} Timed Out (${CONFIG.xhrTimeout/60000}m)`, "ERR"); reject(); };
        
        xhr.send(fd);
      });
    }

    // --- Form Logic (Fallback) ---
    function tryForm(url, label) {
      return new Promise((resolve, reject) => {
        const form = qs('#hiddenForm');
        const input = qs('#hiddenInput');
        const iframe = qs('#sink');
        
        form.action = url;
        const dt = new DataTransfer();
        dt.items.add(state.file);
        input.files = dt.files;

        let finished = false;
        
        const timer = setTimeout(() => {
          if(!finished) {
            finished = true;
            log(`${label} Timed Out (${CONFIG.formTimeout/60000}m)`, "ERR");
            reject();
          }
        }, CONFIG.formTimeout);

        const handler = () => {
          if(finished) return;
          finished = true;
          clearTimeout(timer);
          iframe.removeEventListener('load', handler);
          
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            const txt = doc.body.textContent;
            const processed = processResponse(txt);
            if(processed) resolve(processed);
            else reject();
          } catch(e) {
            log(`${label} iframe blocked (CORS)`, "ERR");
            reject();
          }
        };

        iframe.addEventListener('load', handler);
        form.submit();
      });
    }

    // --- "Deep Search" Algorithm (The Fix) ---
    function processResponse(raw) {
      if(!raw) return null;
      let text = '';

      // 1. Try JSON Parse
      if(raw.trim().startsWith('{')) {
        try {
          const json = JSON.parse(raw);
          // Recursive search for the longest string
          text = findLongestString(json);
        } catch(e) {
          text = raw; // Maybe it wasn't JSON
        }
      } else {
        text = raw;
      }

      // 2. Validation
      if(text && text.length > 50) return text;
      return null;
    }

    function findLongestString(obj) {
      if(typeof obj === 'string') return obj;
      if(typeof obj !== 'object' || obj === null) return '';
      
      let max = '';
      for(let k in obj) {
        const val = findLongestString(obj[k]);
        if(val.length > max.length) max = val;
      }
      return max;
    }

    function handleSuccess(text, label) {
      if(!state.running) return;
      log(`WINNER: ${label}`, "SUCCESS");
      UI.out.value = text;
      UI.dl.disabled = false;
      UI.copy.disabled = false;
      UI.status.textContent = "Done!";
      finish(true);
      
      // Flash effect
      UI.out.style.borderColor = 'var(--ok)';
      setTimeout(() => UI.out.style.borderColor = '', 1000);
    }

    // --- Buttons ---
    UI.copy.addEventListener('click', () => {
      navigator.clipboard.writeText(UI.out.value);
      UI.copy.textContent = 'Copied!';
      setTimeout(() => UI.copy.textContent = 'Copy Text', 2000);
    });
    
    UI.dl.addEventListener('click', () => {
      const blob = new Blob([UI.out.value], {type: 'text/markdown'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = qs('#filename').value || 'ocr.md';
      a.click();
    });

    UI.logBtn.addEventListener('click', () => {
      const blob = new Blob([state.logs.join('\n')], {type: 'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ocr-logs.txt';
      a.click();
    });

  </script>
</body>
</html>
